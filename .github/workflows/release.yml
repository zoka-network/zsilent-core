name: Release

# Manual only. Verification builds are the default; publication requires the
# explicit publish_release gate after the generated artifacts are reviewed.
on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "ZokaNetwork/ZokaNetwork tag whose verified binaries are embedded"
        required: true
        default: "v1.9.1"
        type: string
      release_tag:
        description: "ZSilent tag; must match the app and node version"
        required: true
        default: "v1.9.1"
        type: string
      zoka_sha256:
        description: "Required SHA-256 of the official Windows zoka.exe asset"
        required: true
        type: string
      zokahd_sha256:
        description: "Required SHA-256 of the official Windows zokahd.exe asset"
        required: true
        type: string
      publish_release:
        description: "Publish verified artifacts to release_tag (normally leave off)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: |
              zsilent-core/build/compose/binaries/main/msi/*.msi
              zsilent-core/build/compose/binaries/main/exe/*.exe
            artifact_name: ZSilentCore-windows-installers
          - os: ubuntu-latest
            artifact_glob: zsilent-core/build/compose/binaries/main/deb/*.deb
            artifact_name: ZSilentCore-linux-deb

    steps:
      - name: Checkout zsilent-core
        uses: actions/checkout@v4
        with:
          path: zsilent-core

      - name: Checkout zoka-network release tag
        uses: actions/checkout@v4
        with:
          repository: ZokaNetwork/ZokaNetwork
          ref: ${{ inputs.node_version }}
          path: zoka-network

      - name: Verify app, source and release versions align
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^val releaseVersion = "([^"]+)".*/\1/p' zsilent-core/build.gradle.kts)"
          node_source_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' zoka-network/Cargo.toml | head -n1)"
          test -n "$app_version"
          test "$NODE_VERSION" = "v$app_version"
          test "$RELEASE_TAG" = "v$app_version"
          test "$node_source_version" = "$app_version"
          echo "Version alignment verified: $app_version"

      # Use release assets rather than recompiling Windows binaries. Both
      # checksums are mandatory workflow inputs, so a version bump cannot
      # accidentally retain hashes from an older release.
      - name: Fetch and verify official Windows node binaries
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ inputs.node_version }}
          ZOKA_SHA256: ${{ inputs.zoka_sha256 }}
          ZOKAHD_SHA256: ${{ inputs.zokahd_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ZOKA_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$ZOKAHD_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          mkdir -p zoka-network/target/release
          cd zoka-network/target/release
          gh release download "$NODE_VERSION" --repo ZokaNetwork/ZokaNetwork \
            --pattern 'zoka.exe' --pattern 'zokahd.exe' --clobber
          echo "$ZOKA_SHA256  zoka.exe" | sha256sum -c -
          echo "$ZOKAHD_SHA256  zokahd.exe" | sha256sum -c -
          test "$(./zoka.exe --version)" = "zoka ${NODE_VERSION#v}"
          test "$(./zokahd.exe --version)" = "zokahd ${NODE_VERSION#v}"

      - name: Prepare pinned managed Tor bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/zsilent-core/scripts/prepare-tor-expert-bundle-windows.ps1" `
            -Url "https://archive.torproject.org/tor-package-archive/torbrowser/15.0.18/tor-expert-bundle-windows-x86_64-15.0.18.tar.gz" `
            -Sha256 "6ac067402c7b4a3dc37887ed3754b3914b67fdc220c966190683e9ccf91abf0f" `
            -OutDir "$env:GITHUB_WORKSPACE/zoka-network/third_party/tor/windows-x86_64"

      - name: Install Rust toolchain
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zoka-network/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('zoka-network/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential pkg-config

      - name: Build Linux node binaries from the release tag
        if: runner.os == 'Linux'
        working-directory: zoka-network
        run: cargo build --release --features randomx --bin zoka --bin zokahd

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package native distribution with managed Tor required
        working-directory: zsilent-core
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew packageDistributionForCurrentOS \
            "-Pzoka.nodeRepoRoot=$GITHUB_WORKSPACE/zoka-network" \
            "-Pzsilent.requireTorBundle=true" \
            --no-daemon --stacktrace

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" \) -exec cp {} release/ \;
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
