name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      node_version:
        description: "ZokaNetwork/ZokaNetwork release tag whose verified binaries to embed"
        required: false
        default: "v1.5.0"
      release_tag:
        description: "ZSilent release tag to (re)publish the artifacts to"
        required: false
        default: "v1.5.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: |
              zsilent-core/build/compose/binaries/main/msi/*.msi
              zsilent-core/build/compose/binaries/main/exe/*.exe
            artifact_name: ZSilentCore-windows-installers
          - os: ubuntu-latest
            artifact_glob: zsilent-core/build/compose/binaries/main/deb/*.deb
            artifact_name: ZSilentCore-linux-deb

    steps:
      - name: Checkout zsilent-core
        uses: actions/checkout@v4
        with:
          path: zsilent-core

      - name: Checkout zoka-network (release tag)
        uses: actions/checkout@v4
        with:
          repository: ZokaNetwork/ZokaNetwork
          ref: ${{ github.event.inputs.node_version || 'v1.5.0' }}
          path: zoka-network

      # Embed the exact, verified binaries published in the ZokaNetwork release
      # instead of recompiling from source. Recompiling in CI is non-reproducible
      # (and previously built from `main`, shipping pre-1.5.0 code), so the MSI's
      # embedded zoka.exe never matched the published checksum. Downloading the
      # release assets and checksum-verifying them guarantees the packaged miner
      # is byte-identical to the one users can verify against the network release.
      - name: Fetch & verify official Windows node binaries
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ github.event.inputs.node_version || 'v1.5.0' }}
        run: |
          mkdir -p zoka-network/target/release
          cd zoka-network/target/release
          gh release download "$NODE_VERSION" --repo ZokaNetwork/ZokaNetwork \
            --pattern 'zoka.exe' --pattern 'zokahd.exe' --clobber
          # Pinned v1.5.0 checksums — update these together with NODE_VERSION.
          echo "c8df298cc7cd31da384534467eec042ce24fdd29a1f8b713cb4bed3fdf7767d4  zoka.exe"   | sha256sum -c -
          echo "eda80eef674788617fa20808c72004623d860ba5910ef7a788916beadf18bc0e  zokahd.exe" | sha256sum -c -

      # Linux publishes only `zoka` (no `zokahd`) as a release asset, while the
      # packaging requires both. Build both from the pinned release tag checked
      # out above so the .deb ships the exact 1.5.0 source (not `main`).
      - name: Install Rust toolchain (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zoka-network/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('zoka-network/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential pkg-config

      - name: Build zoka node binaries (Linux)
        if: runner.os == 'Linux'
        working-directory: zoka-network
        run: cargo build --release --features randomx --bin zoka --bin zokahd

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify node binaries exist
        shell: bash
        run: |
          echo "Workspace contents:"
          ls -la "$GITHUB_WORKSPACE"
          echo ""
          echo "zoka-network/target/release contents:"
          ls -la "$GITHUB_WORKSPACE/zoka-network/target/release/" || echo "DIR MISSING"
          echo ""
          echo "trusted-setup contents:"
          ls -la "$GITHUB_WORKSPACE/zoka-network/trusted-setup/" || echo "DIR MISSING"

      - name: Package native distribution
        working-directory: zsilent-core
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew packageDistributionForCurrentOS \
            "-Pzoka.nodeRepoRoot=$GITHUB_WORKSPACE/zoka-network" \
            --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" \) -exec cp {} release/ \;
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
